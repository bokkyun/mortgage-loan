  <body>
    <header>
      <h1>질문 작성</h1>
      <p>주택자금·사이트 이용 관련 질문을 남깁니다. 등록 후 해당 글 보기로 이동합니다.</p>
      <nav class="quick-nav" aria-label="빠른 이동">
        <a href="index.html">Q&amp;A 목록</a>
        <a href="../">홈</a>
        <a href="../didimdol/">디딤돌</a>
        <a href="../beotimmok/">버팀목</a>
        <a href="../dsr/">DSR</a>
        <a href="../return-guarantee/">반환보증</a>
        <a href="../discuss/">은행상품 토론방</a>
      </nav>
    </header>

    <main>
      <p id="qa-write-unavailable-notice" class="disclaimer" style="max-width: 720px; margin: 0 auto 1rem" hidden>
        질문 작성을 불러올 수 없습니다. 잠시 후 다시 시도해 주세요.
      </p>

      <div id="qa-write-main" style="max-width: 720px; margin: 0 auto" hidden>
        <p style="margin: 0 0 0.75rem">
          <a
            class="hub-btn-secondary"
            href="index.html"
            style="display: inline-block; padding: 0.4rem 0.8rem; text-decoration: none"
            >← 목록</a
          >
        </p>
        <section class="card">
          <h2 class="rg-panel-title" style="margin-top: 0">질문 남기기</h2>
          <form id="qa-q-form" class="grid" style="gap: 0.75rem">
            <div>
              <label for="qa-q-title">제목</label>
              <input type="text" id="qa-q-title" maxlength="200" required placeholder="한 줄로 요약" autocomplete="off" />
            </div>
            <div>
              <label for="qa-q-nick">닉네임 (선택)</label>
              <input type="text" id="qa-q-nick" maxlength="40" placeholder="익명 가능" autocomplete="off" />
            </div>
            <div>
              <label for="qa-q-body">내용</label>
              <textarea id="qa-q-body" required rows="8" placeholder="질문 내용"></textarea>
            </div>
            <button type="submit" class="btn-primary" id="qa-q-submit" style="margin-top: 0.25rem">질문 등록</button>
          </form>
        </section>
      </div>
    </main>

    <footer>
      <div class="footer-main" style="max-width: 720px; margin: 0 auto; padding: 0 1.25rem">

      </div>
      <div class="footer-links" style="max-width: 720px; margin: 0.35rem auto 2rem; padding: 0 1.25rem">

        <a href="../disclaimer/">면책 조항</a>
      </div>
